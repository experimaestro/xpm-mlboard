[project]
name = "xpm-mlboard"
dynamic = ["version"]
requires-python = ">=3.11"
keywords = ["experimaestro", "tensorboard", "wandb", "perspective", "machine-learning", "monitoring"]
description = "Lightweight experimaestro services to monitor ML learning curves (TensorBoard, ...)"
readme = "README.md"
license = {text = "GPL-3"}

dependencies = [
    # Service.sync_files (2.10): the table files of the jobs are synced when
    # monitoring a remote workspace
    "experimaestro>=2.10.0",
]

[project.optional-dependencies]
tensorboard = [
    # tensorboard <2.21 imports pkg_resources, removed in setuptools 82
    # (https://github.com/tensorflow/tensorboard/pull/7057).
    "tensorboard>=2.21",
]
# Weights & Biases exporter (driver-side). Needs wandb plus tensorboard to read
# the event files produced by the tasks.
wandb = [
    "wandb>=0.16",
    "tensorboard>=2.21",
]
# Table viewer (Perspective UI over Polars-loaded tables), served with the
# FastAPI/uvicorn stack experimaestro already depends on. The page drives the
# viewer bundled in perspective-python, whose wire protocol is version-specific:
# keep the upper bound until a new major is checked.
tables = [
    "polars>=1",
    "perspective-python>=5.6,<6",
]

[dependency-groups]
test = [
    "pytest>=8",
]
dev = [
    "pre-commit>=4",
    "ruff>=0.15.7",
    {include-group = "test"},
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/xpm_mlboard/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xpm_mlboard"]

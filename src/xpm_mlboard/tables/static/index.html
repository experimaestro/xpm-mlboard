<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment tables</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="static/perspective.css">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
      --side: #f6f8fa; --active: #ddf4ff; --error: #cf222e; --pending: #9a6700;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d;
        --side: #161b22; --active: #1f3a5f; --error: #f85149; --pending: #d29922;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; }
    aside { width: 260px; flex: none; overflow-y: auto; background: var(--side);
      border-right: 1px solid var(--border); padding: 12px 0; }
    aside h1 { font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted); margin: 0 16px 8px; }
    .table { padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent; }
    .table:hover { background: var(--active); }
    .table.selected { background: var(--active); border-left-color: #0969da; }
    .table .name { font-weight: 600; word-break: break-all; }
    .table .meta { color: var(--muted); font-size: 12px; }
    .files { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; }
    .files li { color: var(--muted); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    .files .pending { color: var(--pending); }
    .files .error { color: var(--error); }
    main { flex: 1; min-width: 0; position: relative; }
    #viewer { position: absolute; inset: 0; }
    /* The widget stylesheet sizes its container for notebook cells */
    #viewer.PSPContainer { height: 100%; min-height: 0; padding: 0;
      resize: none; overflow: hidden; }
    #viewer perspective-viewer { width: 100%; height: 100%; }
    .empty { padding: 32px; color: var(--muted); }
  </style>
</head>
<body>
  <aside>
    <h1>Tables</h1>
    <div id="tables"><div class="empty">No table registered yet.</div></div>
  </aside>
  <main>
    <div id="viewer"><div class="empty">Select a table.</div></div>
  </main>
  <script type="module" src="static/app.js"></script>
</body>
</html>
